name: Good first issue
description: A well-scoped task suitable for a first contribution
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a task that is self-contained, clearly
        scoped, and achievable without deep knowledge of the codebase. Good
        first issues should include enough context for someone new to Go or
        to this project to complete the work independently.

  - type: input
    id: title_hint
    attributes:
      label: One-line summary
      description: What needs to be done?
      placeholder: "Add --foo flag to the bar command"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this change matter? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: what_to_do
    attributes:
      label: What to do
      description: |
        Step-by-step instructions. Name the specific file(s) to change and
        describe the exact change needed.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] `sorolens bar --foo` prints the expected output
        - [ ] Change is confined to `cmd/bar.go`
        - [ ] `go test ./...` passes
    validations:
      required: true

  - type: textarea
    id: how_to_test
    attributes:
      label: How to test
      description: Commands the contributor can run to verify their work.
      render: bash
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated complexity
      options:
        - "Trivial (< 1 hour)"
        - "Small (1-3 hours)"
        - "Medium (half day)"
    validations:
      required: true
